name: Update & deploy NodeWatch
on:
  schedule: [{cron: '17 6 * * *'}]
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Refresh data and build
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: ./update.sh
      - name: Commit data snapshot
        run: |
          git config user.name "nodewatch-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data newsletter
          git diff --cached --quiet || (git commit -m "data: refresh $(date -u +%F)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: '${{ steps.d.outputs.page_url }}'}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
